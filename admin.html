<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WETrendingTeam Admin Login</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <img src="images/logo.png" class="logo" alt="WETrendingTeam Logo">
    <h1>WETrendingTeam</h1>
    <h2>Admin Login</h2>
    <p class="description">Notifications and basic moderation.</p>

    <form id="adminLoginForm">
      <label for="adminEmail">Email</label>
      <input type="email" id="adminEmail" placeholder="Enter your email"
             autocomplete="username" required>

      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="Enter your password"
             autocomplete="current-password" required>

      <label class="remember">
        <input type="checkbox" id="adminRemember"> Remember me
      </label>

      <button type="submit" id="adminLoginButton">Login</button>
      <p class="forgot-password"><a href="#" id="adminResetLink">Forgot password?</a></p>
      <p id="adminLoginStatus" class="login-status" aria-live="polite"></p>
    </form>

    <footer>
      <p>Authorized account: <strong>wetrendingteam…</strong></p>
      <p>© 2026 WETrendingTeam</p>
    </footer>
  </div>
</div>
